<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil de Usuario</title>
  <link rel="stylesheet" href="../../css/adoptante/PerfilUsuario.css" />
  <script>
    const rol = localStorage.getItem('rol');
    if (!rol || rol !== 'adoptante') {
      window.location.replace('../inicio/login.html');
    }
  </script>
</head>
<body>
  <nav class="Inicio">
    <div class="Principal"><a href="InicioA.html">Rescue Me</a></div>
    <a href="Adopcion.html">¡Adopta!</a>
    <a href="Donacion.html">Donaciones</a>
    <a href="inf_Refugios.html">Refugios</a>
    <button id="logoutBtn">Cerrar sesión</button>
    <script>
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.clear();
  window.location.replace('../../Inicio.html');
});
</script>
  </nav>
  <div class="" id="nombreUsuario"></div>
  <div class="ContenedorPerfil">
    <h2>Tu Perfil</h2>

    <div class="cardPerfil">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" />
      <button onclick="actualizarCampo('nombre')">Actualizar nombre</button>
    </div>

    <div class="cardPerfil">
      <label for="correo">Correo:</label>
      <input type="email" id="correo" />
      <button onclick="actualizarCampo('correo')">Actualizar correo</button>
    </div>

    <div class="cardPerfil">
      <label for="contraseña">Nueva contraseña:</label>
      <input type="password" id="contraseña" />
      <button onclick="actualizarCampo('contraseña')">Actualizar contraseña</button>
    </div>

    <div id="mensajePerfil"></div>
  </div>
  <script src="../../js/perfilUsuario.js"></script>
  <script src="../../js/mostrarNombre.js"></script>
    <script src="../../js/verificarSesion.js"></script>   
  <script>
  verificarRolPermitido(['adoptante'])
  </script>
</body>
</html>
