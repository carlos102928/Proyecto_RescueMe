<!-- PerfilUsuario.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil de Usuario</title>
  <link rel="stylesheet" href="../../css/adoptante/PerfilUsuario.css" />
  <script>
    const rol = localStorage.getItem('rol');
    if (!rol || rol !== 'adoptante') {
      window.location.replace('../inicio/login.html');
    }
  </script>
</head>
<body>
  <nav class="Inicio">
    <div class="Principal"><a href="InicioA.html">Rescue Me</a></div>
    <a href="Adopcion.html">¡Adopta!</a>
    <a href="Donacion.html">Donaciones</a>
    <a href="inf_Refugios.html">Refugios</a>
    <button id="logoutBtn">Cerrar sesión</button>
  </nav>

  <div class="ContenedorPerfil">
    <h2>Tu Perfil</h2>
    <form id="formPerfil">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required/>

      <label for="correo">Correo:</label>
      <input type="email" id="correo" name="correo" disabled />

      <label for="contrasena">Nueva contraseña:</label>
      <input type="password" id="contrasena" name="contrasena"/>

      <button type="submit">Guardar cambios</button>
    </form>
    <div id="mensajePerfil"></div>
  </div>

  <script src="../../js/perfilUsuario.js"></script>
</body>
</html>
